<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayNest - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #7ebcfa;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #8ea6e8;
        }

        .register-option {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .register-option a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .register-option a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>StayNest</h1>
        <p class="subtitle">Welcome back!</p>

        <form>
            <input type="email" placeholder="Email Address" required>

            <input type="password" placeholder="Password" required>

           <button type="submit">Login</button>
        </form>

        <div class="register-option">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

</body>
</html>
